<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Wildfire Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🔥 Wildfire Impact Calculator</h1>
            </div>
        </header>

        <main>
            <section class="panel">
                <div class="panel-header">
                    <h2>Error</h2>
                </div>
                <div class="panel-content">
                    <div class="status-message error" style="display: block;">
                        {{ message }}
                    </div>
                    <p style="margin-top: 20px;">Please upload a CSV file to get started.</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Wildfire Impact Calculator v1.0</p>
        </footer>
    </div>
</body>
</html>
